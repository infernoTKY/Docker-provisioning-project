version: '3'
services:
  web:
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_NAME=development
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - /app/node_modules
      - .:/app
  tests:
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    command: ['npm', 'run', 'test']
  prod:
    stdin_open: true
    environment:
        - CHOKIDAR_USEPOLLING=true
        - REACT_APP_NAME=production
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - '8080:80'
    volumes:
      - /etc/nginx/conf.d
      - /var/log/nginx
      
